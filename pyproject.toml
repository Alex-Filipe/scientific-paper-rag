[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-paper-rag"
version = "0.2.0"
description = "Backend-first RAG for querying scientific papers with traceable citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langchain-chroma>=1.1,<2.0",
  "langchain-core>=1.8,<2.0",
  "langchain-ollama>=1.1,<2.0",
  "langchain-text-splitters>=1.1,<2.0",
  "langgraph>=1.2,<2.0",
  "pypdf>=5.0,<6.0",
  "python-multipart>=0.0.20,<1.0",
  "rank-bm25>=0.2,<0.3",
  "typer>=0.15,<1.0",
  "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.14,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
]
semantic = ["fastembed>=0.8,<0.9"]
rerank = ["fastembed>=0.8,<0.9"]
openai = ["langchain-openai>=1.8,<2.0"]
ui = ["httpx>=0.28,<1.0", "streamlit>=1.50,<2.0"]
docling = ["docling>=2.151,<3"]

[project.scripts]
paper-rag = "paper_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=src/paper_rag --cov-report=term-missing --cov-fail-under=75"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/paper_rag"]
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = [
  "docling",
  "docling.*",
  "fastembed",
  "fastembed.*",
  "numpy",
  "numpy.*",
  "rank_bm25",
  "rank_bm25.*",
]
follow_imports = "skip"
ignore_missing_imports = true
