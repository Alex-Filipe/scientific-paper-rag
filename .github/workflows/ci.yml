name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev,semantic]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest
      - name: Evaluate retrieval
        run: >-
          paper-rag evaluate evaluation/retrieval_baseline.json
          --embedding hashing --retrieval-mode both --top-k 3
          --min-recall 0.8 --min-mrr 0.7
      - name: Evaluate semantic retrieval
        run: >-
          paper-rag evaluate evaluation/retrieval_paraphrases.json
          --embedding semantic --retrieval-mode both --top-k 3
          --min-recall 0.8 --min-mrr 0.7
